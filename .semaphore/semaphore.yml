version: v1.0
name: Initial Pipeline
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204
blocks:
  - name: 'Block #1'
    task:
      jobs:
        - name: 'Job #1'
          commands:
            - checkout
            - 'echo "Hello, World!"'
            - echo $FOO_1
            - echo $FOO_2
        - name: 'Job #2'
          commands:
            - echo "Second Job"
            - echo $FOO_1
            - echo $FOO_2
      env_vars:
        - name: FOO_1
          value: BAR_1
        - name: FOO_2
          value: BAR_2
